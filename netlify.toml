# netlify.toml — configurazione del sito
# Metti questo file nella cartella principale del progetto, insieme a index.html
# e alla cartella netlify/functions/

[build]
  functions = "netlify/functions"
  publish = "."

# Le funzioni HTTP normali (fred-data, fx-data) vengono chiamate direttamente
# dal browser quando la dashboard si carica — non serve altro per queste due.

# ESEMPIO facoltativo di funzione schedulata (richiede piano Netlify che supporta
# Scheduled Functions). Se vuoi che i dati si aggiornino anche senza che nessuno
# apra il sito, decommenta e adatta:
#
# [functions."fred-data"]
#   schedule = "@daily"
